<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Vigilis pharmacovigilance workspace for structured case intake, assessment, and signal review." />
    <title>Vigilis | Pharmacovigilance workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind via CDN (JIT, supports arbitrary values like text-[13px] used throughout the app) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      html { background: #f5f7fb; }
      body { margin: 0; min-width: 320px; background: #f5f7fb; }
      button, input, select, textarea { font: inherit; }
      button { transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease; }
      button:not(:disabled):hover { transform: translateY(-1px); }
      button:not(:disabled):active { transform: translateY(0); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid rgba(79, 70, 229, .18);
        outline-offset: 2px;
      }
      input, select, textarea {
        border-radius: 10px !important;
        border-color: #d9deea !important;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
        transition: border-color .16s ease, box-shadow .16s ease;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #818cf8 !important;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, .10) !important;
      }
      ::selection { color: #312e81; background: #e0e7ff; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #eef1f7; }
      ::-webkit-scrollbar-thumb { background: #c7cfdd; border: 3px solid #eef1f7; border-radius: 999px; }
      .font-display { font-family: "Space Grotesk", "DM Sans", sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
